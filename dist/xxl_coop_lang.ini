; Asterix & Obelix XXL co-op mod: the texts shown in the game, per language.
;
; The mod picks the section of the game's language (Options > Language):
; [French], [English], [German], [Spanish], [Italian]. A text missing from that
; section is taken from [English]. Save the file as UTF-8; the game reads it
; again within a second, so texts can be changed with the game running.
;
;   key = text
;
; \n starts a new line. Put a text in "quotes" to keep spaces at its ends.
; {name} is filled in by the mod -- keep it, move it where the language wants it:
;   {hero}     a hero's icon (Asterix or Obelix), or its name without icons
;   {button}   a button's icon (pad or key)
;   {stick}    the move directions' icon (left stick, D-pad or keys)
;   {start}    the pad's Start icon, {key} the keyboard's join key
;   {seconds}  a number of seconds
;   {player}   the P1 / P2 icon, {n} a player's number
;   {dir}      a direction (dir_up, dir_down, dir_left, dir_right below)
; Only letters of the game's own font for that language show (each language's
; font has its accents). In split screen both boxes share the screen's width:
; keep a pair's texts short enough not to meet (the Fusion's move_left_right
; and move_front_back stand side by side).

