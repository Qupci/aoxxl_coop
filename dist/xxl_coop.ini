# ----- Settings for the Asterix & Obelix XXL co-op mod (xxl_coop.asi) -----

[coop]

# Master switch. off = the mod loads but does nothing at all.
enabled = on

# Player 2 joins by pressing Start on the controller the game is NOT using, and
# takes the hero player 1 is not driving. Press Start again (or hold Back) to
# leave. The mod works out by itself which controller the game reads (player
# 1's): leave this at -1. Only if detection ever gets it wrong, put the XInput
# slot (0-3) of player 1's controller here, or "keyboard" if player 1 plays on
# the keyboard (the game's own keyboard controls).
p1_pad = -1

# Player 2's hero: obelix (default), asterix, or other = whichever hero the
# game is not leading with when player 2 joins.
p2_hero = obelix

# Mod buttons (only with cheats = on, [debug]): hold the right stick button
# (R3) on your controller -- player 2 can also hold Back, keyboard: Backspace --
# and press
#   A  your hero jumps to your partner's (lost, stuck, fell behind)
#   B  take your hero back when the game keeps it waiting (a sequence played out
#      of order can leave a "wait here" that never ends), or reset your hero
#      if it is stuck and cannot move
#   Y  fill the magic potion
#   X  make your hero the leader       (last resort)
#   D-pad up    Asterix gets the nearest torch, lit
#   D-pad down  Asterix throws his torch away
#   D-pad left  every combo learned, combo bar full
# Single player too, with [single_player] sp_isolation = off: on your
# controller, the other hero your partner -- A brings it to you (you to it when
# it is down), B frees it from a level's wait (its sequence undone), X switches
# to it.

# Safe sequence: a lever whose event hands the lead to a hero ("switch to
# Asterix") only works for the player who is not leading when it would really
# change the leader. Levels are built for one player at a time; hit out of turn
# such a lever can leave a hero waiting forever (level 2: the lever behind the
# iron crates, then the hearth). off = levers work for both players as before.
safe_sequence = on

# Individual heroes: each hero has its own health, shields and combo bar (the
# helmets stay shared). A hero that falls stays down until the other player
# holds the grab button (B) next to them (revive_hold_seconds; back with half
# their health), or goes on into the next sector; only when both heroes are down
# is it game over (or with revive_time_limit, when the time runs out). A fall on
# the belly slide or the boat is game over at once. A hero that fell leading
# where the other can't walk to them (a one-way drop, a door shut behind them):
# the other is brought to the nearest place they can walk to them from, and
# walks the rest. off = shared health, as in single player.
individual_heroes = on

# Revive (with individual_heroes): seconds the other player holds the grab
# button by a downed hero to get them up.
revive_hold_seconds = 5
# Under a Roman catapult's fire (between its passive range and its attack
# range) the hold is this share (0.05 to 1) of the time between its stones --
# its charge duration (LV3-1's 3.5 s: 1.4 s; LV6-4's 5 s: 2 s); several
# catapults: their stones together. Lower: done earlier between two stones.
# Never longer than revive_hold_seconds.
revive_hold_catapult_window = 0.4

# Revive time limit: a downed hero not revived in time is the game over -- the
# death sequence on that hero; the other one stays on their feet.
#   off   no limit
#   auto  the time the other hero needs to walk there (the level's pathfinding,
#         about 6.8 units a second) plus revive_time_limit_grace
#   N     N seconds from the fall
# The downed hero's player's box counts it down (single player's second chance:
# a box at the bottom left). It waits while paused, at the
# merchant, in a cutscene, and while the other hero has no way to the downed
# one; a grab already held always finishes the revive.
revive_time_limit = off
# Seconds the limit leaves for the revive itself, once there: added to the walk
# (auto); with N seconds, a hero cut off from a downed leader is brought no
# further than it can walk in what is left of N before these seconds.
revive_time_limit_grace = 30

# Romans guard a downed hero (with individual_heroes, and single player's
# second chance): up to 5 Romans near a
# hero as it falls stand round it until it is revived (a spot by a wall or a
# drop is left out, one guard fewer; a guard that can't get to its spot stops
# where it is after 1 s), blocking hits from the front with a shield (a quick
# combo or a hit from behind gets through). The standing hero within 5 units of
# the downed one: they go for it, staying within those 5 units of the downed
# hero, back round it once it is 6.5 away. A guard a hit lands on breaks off and
# fights as usual; the last guard left goes for the standing hero. Only basic
# Romans guard -- never lions, pirates, Normans, leaders (centurions, tamers),
# archers, jumping or jetpack Romans, turtles or towers. off = they all go after
# the standing hero.
romans_guard_downed = on

# No-lock mode: the level never takes a player's hero -- no "wait here" (the
# light pillars' circles, the rotary beam's circle), no walking it to a marker:
# the player does those by hand (jump off the spinning platform at its top;
# under the rotary beam, jump -- the game then catches it, rides it across and
# gives it back as it lets go). Cable cars still take the hero (the rope one
# and the automatic one).
# off = the level's waits and walks as in single player (R3 + B undoes them).
nolock = on

# No-lock mode: a corkscrew's circle (LV3-6's light pillar that shoots Asterix
# up, LV2-1's spinning platform) still locks the hero on it, as with nolock
# off -- the launch aims the jump. (The bosses of LV2-10 / LV3-6 always lock
# Asterix on their button.)
nolock_except_corkscrews = on

# No-lock mode: a rotary beam's light pillar (LV2-8, LV3-2, LV4-2) still locks
# the hero on its circle, as with nolock off -- the beam takes the waiting hero
# by itself, and what the level does with it after the beam lets go (a wait, a
# walk to a mark) is the level's too. off = jump for the beam (see above).
nolock_except_rotarybeams = off

# A hero who boards the automatic cable car while the other hero leads takes
# the lead at once, as in single player, where only the leader can board. off =
# the lead stays where it is and the ride still works (the jump off at the end,
# the helmets on the way). The rope cable car hands the lead to the hero at the
# rope as it takes its rider anyway, as in single player.
cable_car_rider_leads = off

# Only with nolock = off (nolock = on walks no player's hero to a marker): the
# level walks a player's hero to a marker now and then (in single player with
# sp_isolation off, the AI companion too). on = a hero the pathfinding finds no
# way there for (a door shut behind it: LV2-3, Obelix in the hearth room as
# Asterix lights the hearth) is put on its marker instead; off = it keeps
# trying to walk there, as in the game.
walk_to_marker_teleport = on

# A fight's Romans come in at the level's spawn points out of both players'
# views. When every spawn point of the fight is in a player's view: on = they
# come anyway, at the one farthest from both heroes (in plain view); off = they
# wait until a camera turns away from one, so a fight can stand still while
# both cameras keep all its spawn points in sight.
romans_spawn_in_view = off

# The magic potion also works on a player's Obelix: run speed and invincibility
# as for Asterix (single player only ever gives it to Asterix). The triple
# jump stays Asterix's -- Obelix has no third jump animation. Single player too
# with [single_player] sp_isolation = off: Obelix while you lead with him (the
# flask still waits for Asterix: only he drinks it).
obelix_potion = on

# A hero left behind in a sector the game no longer streams (the other player
# went on into the next one) is brought to the other player after this many
# milliseconds.
sector_catch_up_ms = 1000

# How long (milliseconds) player 2 must hold Back to leave co-op.
drop_hold_ms = 1500

# Left stick deadzone for player 2's pad, 0.0 - 0.9
deadzone = 0.24

# Split-screen while player 2 is in: each player gets half the screen and a
# camera on their own hero; the HUD stays shared. off = both players share
# player 1's camera. Scripted sections (rides, cutscenes) always use one screen.
split_screen = on

# horizontal = player 1 on top, player 2 below
# vertical   = player 1 on the left, player 2 on the right
split_mode = vertical

# Each player's camera in split screen:
#   game = each player gets their own copy of the game's camera: right stick
#          up/down pulls it in and out, it pulls back in fights, and the
#          level's fixed and scripted cameras show on the screen of the player
#          who walked into them. While the game holds a player's hero for a
#          scripted sequence (riding the cable car, waiting on the spinning
#          platform) that player gets the mod's own camera to look around.
#   mod  = the mod's own follow camera for player 2 (right stick orbits).
camera = game

# Extra field of view, in degrees, for each half of the split screen (adds to
# the game's own, and to a wide-FOV patch's if one is on). 0 = none.
split_fov = 15


[keyboard]

# The keyboard counts as one more controller for player 2: press the "start"
# key below to join on it (while player 1 uses a gamepad), and the "start" key
# again or hold "back" to leave. Mixed setups all work:
#   player 1 gamepad  + player 2 keyboard (keys below)
#   player 1 keyboard + player 2 gamepad  (player 1 uses the game's own keys)
#   both on one keyboard: player 2's keys must not be any of the game's own
#     keyboard keys -- see the numpad layout at the end of this section.
# While player 2 plays on the keyboard, their keys are kept from the game, so
# they never move player 1's hero.
# Keys: a letter or digit, SPACE ENTER BACKSPACE TAB ESC UP DOWN LEFT RIGHT
# INSERT DELETE HOME END PAGEUP PAGEDOWN LSHIFT RSHIFT LCTRL RCTRL F1-F12
# NUM0-NUM9 NUMDIV NUMMUL NUMMINUS NUMPLUS NUMDOT COMMA PERIOD SEMICOLON SLASH,
# NONE, or a Windows virtual-key code like 0x26.
enabled = on

move_up = W
move_down = S
move_left = A
move_right = D

# Player 2's camera (the right stick on a gamepad).
look_up = UP
look_down = DOWN
look_left = LEFT
look_right = RIGHT

# Gamepad equivalents: jump = A, attack = X, grab = B, dash = Y.
jump = SPACE
attack = J
grab = K
dash = L
lb = U
rb = O
start = ENTER
back = BACKSPACE
# The camera back behind the hero (R3 on a gamepad).
center_camera = R

# Both players on one keyboard: the game's own keyboard controls use the
# arrows, SPACE, F, G, D, R, C, P, I, V, ENTER, ESC, SHIFT and CTRL, so give
# player 2 the numpad instead (Num Lock on):
#   move_up = NUM8, move_down = NUM5, move_left = NUM4, move_right = NUM6,
#   look_up = NUMDIV, look_down = NUM2, look_left = NUM7, look_right = NUM9,
#   jump = NUM0, attack = NUM1, grab = NUM3, dash = NUMDOT,
#   lb = INSERT, rb = DELETE, start = HOME, back = END,
#   center_camera = NUMPLUS

[coop_difficulty]

# Harder rules for two players. Each number is a factor: 2 = double, 1 (or
# off) = the game's own. The merchant's prices change the levels as they load
# (a change takes effect after restarting the game); the squads and the combo
# bar follow the game as it goes:
# - The heroes apart -- one held by the level (a cable car ride, a wait), down
#   waiting to be revived, or where the other can't walk to it -- the one left
#   fights with the game's numbers: Romans at once and the combo bar as the
#   level has them, and a fight that starts then has the level's Romans to
#   defeat until the heroes are together again.
# - difficulty_coop_only = on: in single player (player 2 not in) the game's
#   own numbers too; a fight going on when player 2 leaves has its Romans
#   still to defeat halved, and doubled again when they come back in. off:
#   single player has the rules (only with [single_player] sp_isolation = off).
difficulty_coop_only = on

# on: static rules -- the squads and the combo bar have the rules all through
# co-op, whether a hero is held, down or cut off (difficulty_coop_only still
# counts). off: they follow the heroes as above.
difficulty_static = off

# The heroes count as apart too where neither can walk to the other (the
# level's pathfinding, looked up every half second). off: only a hero held or
# down. Not looked up with difficulty_static on, or with every squad and combo
# bar number at 1.
difficulty_pathfinding = on

# on: a fight that started with the heroes apart keeps the level's Romans to
# defeat once they are together again, instead of being doubled then.
difficulty_to_defeat_stays = off

# Romans of a squad alive at once: the level's own numbers and the squad's
# script (keep so many alive, send so many in). The level's numbers while
# the heroes are apart. Decimals work (2.5). Above 1, the levels are rebuilt
# with that many times the basic Romans, leaders, archers and jumping Romans
# in each of their pools (a squad can't have more at once than its pool
# holds: LV4's fights share 18; not the jetpack Romans). The rebuilt levels
# always have twice the level's crates and bonuses (helmets...) as well, so
# both views have objects for them. Kept in coop_levels\ beside the game
# (made at the first start, again when this changes); the original level
# files are left as they are.
squad_romans_at_once = 2

# Romans to defeat: each kind of Roman in a squad this many times, so a fight's
# total (the number on the gate) is that many times too. Left as the level has
# them: squads whose Romans are all placed from the start (the hiding ones), the
# turtles, the mobile tower and the jetpack Romans -- their share goes to the
# other Romans behind the same gate, so its number still comes out doubled.
# A fight's number is set as it begins: behind a gate, as the gate closes in
# (and a moment after, so doors it shuts between the heroes count); without a
# gate, at its first Roman beaten. It stays when the heroes come apart. One
# that began with the heroes apart is doubled once they are together again --
# the Romans still to defeat (85 left: 170).
squad_romans_to_defeat = 2

# The merchant's prices (helmets), in single player too.
merchant_prices = 2

# The combo bar: how much a hit counts. 0.5 = it fills twice as slowly. The
# game's own while the heroes are apart (a bar under way keeps how full it is).
combo_bar_fill = 0.5

# How fast the combo bar drains: losing its hits before it is full, and a full
# bar running out. 1.5 = half as fast again.
combo_bar_drain = 1.5
combo_bar_full_drain = 1.5


[coop_difficulty.experimental]

# No-lock mode (nolock = on in [coop]): while the level would have kept the
# hero who is not leading waiting (the leader is in a locked fight, or rides or
# waits in a sequence), Romans come for that hero in groups of 1 to 6, the first
# 5 to 25 s after the wait begins, the next 20 to 90 s (mostly about 30) after
# the last of a group is beaten -- a squad's mix of Romans, the big ones too
# (never archers, jumping or jetpack Romans, turtles or towers), at a spawn
# marker out of view that the hero can walk to. They come from a fight won
# anywhere in the level ("revenge"), 20 to 90 s after the win (one still in that
# pause is waited for): its squad's area is moved over (or, if it holds the
# hero, grown over) what the hero can reach while they are out, so they follow
# the hero anywhere it walks (the area back once they are beaten -- the next
# group may come from another won fight -- or once the wait is over, when any
# left outside it vanish). Only while no fight has been won yet, from a squad
# whose area holds the hero and whose fight has begun (LV3-6's Romans that come
# once the keg blows stay till then), never from a locked fight's squads while
# it lasts (those are the other hero's); those stay within their squad's area,
# waiting at its edge if the hero leaves it. They face and go after that hero
# (one held back from where it is going for a second stands still until the
# hero moves somewhere it can walk to), start no fight music, and keep coming
# until the other player lifts the wait. on / off.
nolock_romans = on

# With nolock_romans: a Roman may also come in at another squad's spawn markers
# near the waiting hero, not only at those of the squad it comes from (a marker
# placed for other Romans can leave one stuck in the air). A won fight's squad
# moved over to the hero always may (its own markers are far off). on / off.
nolock_romans_any_markers = off


[hints]
# Co-op hints in the players' boxes (the game's prompts always show).
# At a level's start, how player 2 joins (and leaves).
hint_join = on
# While a hero spins a Roman with the other near: its button passes the Roman
# (three times a level for each hero, until that hero has passed one).
hint_pass_roman = on
# Combo hints: a combo bought in the level (with a full combo bar by a Roman,
# until done once), the Twister in a fight with more than 100 Romans to beat,
# Twister Fusion's button while both heroes spin side by side.
hint_combos = on
# The machine gun: who moves it and who fires, Obelix's A to leave it,
# Asterix's X to join him.
hint_machine_gun = on

[single_player]
# Co-op features for playing alone (player 2 not in).

# Isolation: single player stays the game's own -- none of the options below,
# whatever they say, and none of the co-op options' single player parts
# (obelix_potion, cheats and the mod buttons, difficulty_coop_only = off); only
# player 2's join hint at a level's start. off = the options below, Obelix's
# potion and the cheats in single player too.
sp_isolation = on

# The combo hints (see [hints] hint_combos) in your box at the bottom right, for
# whichever hero you lead with: a combo bought in the level (with a full combo
# bar by a Roman, until done once), the Twister in a fight with more than 100
# Romans to beat, Twister Fusion's button while both heroes spin side by side.
sp_combo_hints = on

# The mod's button icons in the game's texts (prompts, menus, dialogues): your
# pad's buttons, or your keys when you play on the keyboard.
sp_coop_icons = on

# A button switches to the other hero (he leads, the other follows as before).
# Only while both are free: not while the level holds the other hero (waiting
# on a light pillar's circle, riding a cable car, walking to a mark), during a
# ride, the belly slide, a machine, a cutscene, the merchant, in the air, or
# with the other hero more than 25 units away -- then he says "no". What the
# level leaves to one hero stays that hero's: a corkscrew's circle (LV2-1's
# spinning platform, LV3-6's light pillars) answers only the hero it makes
# wait, a lever that hands the lead to the hero at it ignores him (switch and
# pull it with the other one), a spitter's potion waits for Asterix. Obelix
# leading takes the machine gun: he turns it, and Asterix runs over to fire it
# (no shot before he is there); off it, Obelix leads again. Obelix's Twister
# goes through a crowd of Romans as Asterix's does.
sp_hero_switch = on
# The pad button: dpad_up, dpad_down, dpad_left, dpad_right, back, l3, none.
sp_hero_switch_button = dpad_up
# The key, when you play on the keyboard (a key the game does not use).
sp_hero_switch_key = TAB
# Switch lock (with sp_hero_switch): the hero you play stays yours. The level's
# own lead switches are ignored (a lever's or a zone's "Obelix leads") -- except
# one to the hero you play (the level ending a ride that way: a rope cable car's
# landing) and one that holds your hero (a light pillar's circle making it wait,
# a walk to a mark): you play the other one until the level lets yours go, then
# yours leads again (once it is free and within 25 units; still further away after 3 s, you
# keep the one you have). Not while the sequence it was held for goes on after
# letting it go (LV2-1: the spinning platform's turn; its top gives Asterix the
# lead anyway). A ride the game makes no switch for (the automatic cable car)
# stays as it is. When the level later orders "the sidekick" somewhere meaning
# your hero (a walk to a mark after a switch it was denied), the other hero leads
# for it first -- a hold of yours, as above. An ignored switch to the other hero
# that the level held (LV3-5: Obelix jumping off the corkscrew into the box that
# hands him the lead) lets him go: he follows you. While you play the hero the
# level means as the sidekick, its zones for the other hero answer yours, not
# the companion's (LV2-10's boss gate: Obelix starts the intro and wakes the
# boss), a cutscene holds your hero still, and a boss run's "the sidekick runs
# to a mark" sends the companion: you keep the lead. off = the level switches
# heroes as in the game.
sp_hero_switch_lock = on

# Second chance: each hero has his own health, shields and combo bar -- the
# health of both at the top left (Asterix's row in red, Obelix's under it in
# blue), the combo bar the one you lead with. When your hero falls, you play on
# with the other one; the fallen one stays down until you hold the grab button
# (B) next to him (revive_hold_seconds), or you go on into another area; then he
# is up with half his health -- and leads again if he led when he fell. When
# the other hero falls, he waits for you the same way. Both down is the game
# over, and so is a fall on the belly slide or the boat. The same rules as
# individual_heroes in co-op: what needs both heroes
# (lifters, cable cars, circles, launchers, the boss gates, a Roman agent's
# talk) stays shut while one is down; if the other hero is held by the level
# when yours falls (a light pillar's wait, a cable car), that is undone so he
# can come; a hero cut off from the fallen one is brought where he can walk to
# it; Romans guard the fallen hero (romans_guard_downed); revive_time_limit
# counts down in a box at the bottom left.
sp_second_chance = off

# Sidekick view: a small view of the other hero at the bottom left of the
# screen, with a camera of his own. It shows for 5 s when the hero switch says
# "no" (each "no" starts the 5 s over; a switch that goes through takes it
# away at once), and with second chance while the other hero is down, until he
# is up again or the game is over. Not during a cutscene or the pause. The HUD
# (prompts, the revive countdown) stays on top of it. off = no view.
sp_sidekick_view = on

[debug]

# Test helpers and the mod buttons (see them in [coop]): R3 + A / B, R3 + Y
# fills the magic potion, R3 + X makes your hero the leader, the D-pad's torch
# and combos. off = no mod buttons at all. Single player too with
# [single_player] sp_isolation = off.
cheats = on

# Write who the leader is on the screen ("LEADER: OBELIX (P2)": player 1's hero
# in red, player 2's in blue, white before player 2 joins) -- in the leader's
# half of a split screen. The leader is the game's own (the level's scripts
# and Idefix follow it); each player still controls their own hero.
show_leader = off

# Single player: the sidekick view ([single_player] sp_sidekick_view) on all
# the time while playing -- to watch what the AI companion does (its
# pathfinding, its orders). Also with sp_isolation on.
sidekick_view_always = off

# Every cutscene can be ended with Enter (the game's own skip), including the
# long intro of level 1, which normally cannot be skipped.
skip_cutscenes = on

# Write extra detail to xxl_coop.log (hero state every 2 s from the watchdog).
verbose = on

# Jump straight into a level number on startup instead of going through the
# menus. -1 = off. Level 1 is the first playable level.
force_level = 2

# Background thread that reports engine state every 2 s.
watchdog = on

# Count calls through the hero / hero-life vtables.
vtable_profile = off

# Locate the scene-render call by hooking RwCamera.beginUpdate.
render_probe = off

# Render the scene twice per frame (unchanged), to prove the draw is re-entrant.
split_test = off
