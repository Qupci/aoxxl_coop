# ----- Settings for the Asterix & Obelix XXL co-op mod (xxl_coop.asi) -----

[coop]

# Master switch. off = the mod loads but does nothing at all.
enabled = on

# Player 2 joins by pressing Start on the controller the game is NOT using, and
# takes the hero player 1 is not driving. Press Start again (or hold Back) to
# leave. The mod works out by itself which controller the game reads (player
# 1's): leave this at -1. Only if detection ever gets it wrong, put the XInput
# slot (0-3) of player 1's controller here, or "keyboard" if player 1 plays on
# the keyboard (the game's own keyboard controls).
p1_pad = -1

# Player 2's hero: obelix (default), asterix, or other = whichever hero the
# game is not leading with when player 2 joins.
p2_hero = obelix

# Mod buttons: hold the right stick button (R3) on your controller -- player 2
# can also hold Back, keyboard: Backspace -- and press
#   A  your hero jumps to your partner's (lost, stuck, fell behind)
#   B  take your hero back when the game keeps it waiting (a sequence played out
#      of order can leave a "wait here" that never ends), or reset your hero
#      if it is stuck and cannot move
#   Y  fill the magic potion           (only with cheats = on, [debug])
#   X  make your hero the leader       (only with cheats = on; last resort)
#   D-pad up    Asterix gets the nearest torch, lit   (only with cheats = on)
#   D-pad down  Asterix throws his torch away         (only with cheats = on)

# Safe sequence: a lever whose event hands the lead to a hero ("switch to
# Asterix") only works for the player who is not leading when it would really
# change the leader. Levels are built for one player at a time; hit out of turn
# such a lever can leave a hero waiting forever (level 2: the lever behind the
# iron crates, then the hearth). off = levers work for both players as before.
safe_sequence = on

# A hero left behind in a sector the game no longer streams (the other player
# went on into the next one) is brought to the other player after this many
# milliseconds.
sector_catch_up_ms = 1000

# How long (milliseconds) player 2 must hold Back to leave co-op.
drop_hold_ms = 1500

# Left stick deadzone for player 2's pad, 0.0 - 0.9
deadzone = 0.24

# Split-screen while player 2 is in: each player gets half the screen and a
# camera on their own hero; the HUD stays shared. off = both players share
# player 1's camera. Scripted sections (rides, cutscenes) always use one screen.
split_screen = on

# horizontal = player 1 on top, player 2 below
# vertical   = player 1 on the left, player 2 on the right
split_mode = vertical


[keyboard]

# The keyboard counts as one more controller for player 2: press the "start"
# key below to join on it (while player 1 uses a gamepad), and the "start" key
# again or hold "back" to leave. Mixed setups all work:
#   player 1 gamepad  + player 2 keyboard (keys below)
#   player 1 keyboard + player 2 gamepad  (player 1 uses the game's own keys)
#   both on one keyboard: player 2's keys must not be any of the game's own
#     keyboard keys -- see the numpad layout at the end of this section.
# While player 2 plays on the keyboard, their keys are kept from the game, so
# they never move player 1's hero.
# Keys: a letter or digit, SPACE ENTER BACKSPACE TAB ESC UP DOWN LEFT RIGHT
# INSERT DELETE HOME END PAGEUP PAGEDOWN LSHIFT RSHIFT LCTRL RCTRL F1-F12
# NUM0-NUM9 NUMDIV NUMMUL NUMMINUS NUMPLUS NUMDOT COMMA PERIOD SEMICOLON SLASH,
# NONE, or a Windows virtual-key code like 0x26.
enabled = on

move_up = W
move_down = S
move_left = A
move_right = D

# Player 2's camera (the right stick on a gamepad).
look_up = UP
look_down = DOWN
look_left = LEFT
look_right = RIGHT

# Gamepad equivalents: jump = A, attack = X, grab = B, dash = Y.
jump = SPACE
attack = J
grab = K
dash = L
lb = U
rb = O
start = ENTER
back = BACKSPACE

# Both players on one keyboard: the game's own keyboard controls use the
# arrows, SPACE, F, G, D, R, C, P, I, V, ENTER, ESC, SHIFT and CTRL, so give
# player 2 the numpad instead (Num Lock on):
#   move_up = NUM8, move_down = NUM5, move_left = NUM4, move_right = NUM6,
#   look_up = NUMDIV, look_down = NUM2, look_left = NUM7, look_right = NUM9,
#   jump = NUM0, attack = NUM1, grab = NUM3, dash = NUMDOT,
#   lb = INSERT, rb = DELETE, start = HOME, back = END


[debug]

# Test helpers: R3 + Y fills the magic potion, R3 + X makes your hero the
# leader (see the mod buttons in [coop]).
cheats = on

# Write extra detail to xxl_coop.log (hero state every 2 s from the watchdog).
verbose = on

# Jump straight into a level number on startup instead of going through the
# menus. -1 = off. Level 1 is the first playable level.
force_level = 2

# Background thread that reports engine state every 2 s.
watchdog = on

# Count calls through the hero / hero-life vtables.
vtable_profile = off

# Locate the scene-render call by hooking RwCamera.beginUpdate.
render_probe = off

# Render the scene twice per frame (unchanged), to prove the draw is re-entrant.
split_test = off
